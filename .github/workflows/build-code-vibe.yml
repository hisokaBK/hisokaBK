name: Build code-vibe profile preview
on:
  push:
    branches: [redesign/code-vibe-profile]
    paths:
      - scripts/build_code_vibe.py
      - .github/workflows/build-code-vibe.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_code_vibe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/code-vibe
          if ! git diff --cached --quiet; then
            git commit -m "Build visual profile GIFs and PNG buttons"
            git push origin HEAD:refs/heads/redesign/code-vibe-profile
          fi
