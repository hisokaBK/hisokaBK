name: Update starred repositories badge

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours; scheduled runs occur on the repository default branch.
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read starred repositories from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_starred_badge.py
      - name: Commit only if the badge changed
        run: |
          if git diff --quiet -- assets/badges/starred.svg; then
            echo "Starred repo badge has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges/starred.svg
          git commit -m "chore: update starred repositories badge [skip ci]"
          git push
